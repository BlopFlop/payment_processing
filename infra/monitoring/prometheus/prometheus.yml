global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000

  - job_name: producer
    dns_sd_configs:
      - names: ["producer"]
        type: A
        port: 8001

  - job_name: consumer
    dns_sd_configs:
      - names: ["consumer"]
        type: A
        port: 8001
