name: payment_processing

services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payment}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-payment}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - broker_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    env_file:
      - ../${ENV_FILE:-.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - broker_network
      - api_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: payment-processing:latest
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../${ENV_FILE:-.env}
    environment:
      BROKERSERVICE_URL: amqp://${RABBITMQ_USER:-payment}:${RABBITMQ_PASSWORD:-payment}@rabbitmq:5672/
      APISERVICE_APP_TYPE: api
    volumes:
      - ../logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - api_network
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: payment-processing:latest
    env_file:
      - ../${ENV_FILE:-.env}
    environment:
      BROKERSERVICE_URL: amqp://${RABBITMQ_USER:-payment}:${RABBITMQ_PASSWORD:-payment}@rabbitmq:5672/
      APISERVICE_APP_TYPE: api
    ports:
      - "8000:8000"
    volumes:
      - ../logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - api_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  producer:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: payment-processing:latest
    env_file:
      - ../${ENV_FILE:-.env}
    environment:
      BROKERSERVICE_URL: amqp://${RABBITMQ_USER:-payment}:${RABBITMQ_PASSWORD:-payment}@rabbitmq:5672/
      APISERVICE_APP_TYPE: producer
    volumes:
      - ../logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - broker_network
    restart: unless-stopped

  consumer:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: payment-processing:latest
    env_file:
      - ../${ENV_FILE:-.env}
    environment:
      BROKERSERVICE_URL: amqp://${RABBITMQ_USER:-payment}:${RABBITMQ_PASSWORD:-payment}@rabbitmq:5672/
      APISERVICE_APP_TYPE: consumer
    volumes:
      - ../logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - broker_network
    restart: unless-stopped

  webserver:
    image: nginx:stable-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - api_network
    restart: unless-stopped
    profiles:
      - nginx

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - api_network
      - broker_network
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - monitoring
      - prometheus

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payment-processing.json
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - monitoring
      - grafana

volumes:
  db_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  broker_network:
    driver: bridge
  api_network:
    driver: bridge
  monitoring_network:
    driver: bridge
