name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/payment-processing' }}
      APP_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS не задан — ключ сервера берётся через ssh-keyscan (без защиты от MITM)"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      - name: Upload infra and .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          ssh server "mkdir -p '$DEPLOY_PATH/logs'"
          tar czf - infra | ssh server "tar xzf - -C '$DEPLOY_PATH'"

          {
            printf '%s\n' "$PROD_ENV"
            echo "APP_IMAGE=$APP_IMAGE"
          } | ssh server "umask 077 && cat > '$DEPLOY_PATH/.env'"

      - name: Pull and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh server bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          compose() { docker compose -f infra/docker-compose.prod.yaml --env-file .env "$@"; }

          compose pull
          compose up -d --no-build --remove-orphans
          docker image prune -f
          REMOTE

      - name: Logout from registry
        if: always()
        run: ssh server "docker logout ghcr.io" || true

      - name: Health check
        run: |
          ssh server bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          compose() { docker compose -f infra/docker-compose.prod.yaml --env-file .env "$@"; }

          api_ok=false
          for _ in $(seq 1 30); do
            if [ "$(compose ps api --format '{{.Health}}')" = "healthy" ]; then
              echo "api healthy"
              api_ok=true
              break
            fi
            sleep 5
          done

          if [ "$api_ok" != true ]; then
            echo "::error::api не стал healthy за 150 с"
            compose ps -a
            compose logs --tail 100 migrate api producer consumer
            exit 1
          fi

          for _ in $(seq 1 24); do
            if curl -fsS --max-time 5 http://localhost/api/health > /dev/null; then
              echo "nginx проксирует запросы в api"
              compose ps
              exit 0
            fi
            sleep 5
          done

          echo "::error::http://localhost/api/health не отвечает за 120 с"
          compose ps -a
          compose logs --tail 100 webserver api
          exit 1
          REMOTE
