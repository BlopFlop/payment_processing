<marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}.t{font-size:14px;font-weight:600} .s{font-size:11px;fill:#656d76} .e{font-size:11px;fill:#656d76}.n rect{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}.edge{stroke:#afb8c1;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.webhook{stroke:#1a7f37;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#arrow-ok);animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-9}}@keyframes g-api{0%,7.07%{stroke:#d0d7de;fill:#ffffff}8.27%{stroke:#0969da;fill:#ddf4ff}14.27%,100%{stroke:#d0d7de;fill:#ffffff}}#n-api rect{animation:g-api 9.0s linear infinite}@keyframes g-db{0%,19.06%{stroke:#d0d7de;fill:#ffffff}20.26%{stroke:#0969da;fill:#ddf4ff}26.26%,100%{stroke:#d0d7de;fill:#ffffff}}#n-db rect{animation:g-db 9.0s linear infinite}@keyframes g-relay{0%,31.05%{stroke:#d0d7de;fill:#ffffff}32.25%{stroke:#0969da;fill:#ddf4ff}38.25%,100%{stroke:#d0d7de;fill:#ffffff}}#n-relay rect{animation:g-relay 9.0s linear infinite}@keyframes g-mq{0%,43.04%{stroke:#d0d7de;fill:#ffffff}44.24%{stroke:#0969da;fill:#ddf4ff}50.24%,100%{stroke:#d0d7de;fill:#ffffff}}#n-mq rect{animation:g-mq 9.0s linear infinite}@keyframes g-consumer{0%,55.03%{stroke:#d0d7de;fill:#ffffff}56.23%{stroke:#0969da;fill:#ddf4ff}62.23%,100%{stroke:#d0d7de;fill:#ffffff}}#n-consumer rect{animation:g-consumer 9.0s linear infinite}@keyframes g-gateway{0%,67.02%{stroke:#d0d7de;fill:#ffffff}68.22%{stroke:#1a7f37;fill:#ddf4ff}74.22%,100%{stroke:#d0d7de;fill:#ffffff}}#n-gateway rect{animation:g-gateway 9.0s linear infinite}@keyframes g-client{0%,84.80%{stroke:#d0d7de;fill:#ffffff}86.00%{stroke:#1a7f37;fill:#ddf4ff}92.00%,100%{stroke:#d0d7de;fill:#ffffff}}#n-client rect{animation:g-client 9.0s linear infinite}@keyframes status{0%,68.12%{fill:#bf8700}68.22%,100%{fill:#1a7f37}}#packet{animation:status 9.0s steps(1,end) infinite}@keyframes lbl-p{0%,68.12%{opacity:1}68.22%,100%{opacity:0}}@keyframes lbl-s{0%,68.12%{opacity:0}68.22%,100%{opacity:1}}#lbl-p{animation:lbl-p 9.0s steps(1,end) infinite;fill:#bf8700}#lbl-s{animation:lbl-s 9.0s steps(1,end) infinite;fill:#1a7f37}</style>
