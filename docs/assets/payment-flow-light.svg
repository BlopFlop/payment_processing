<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Путь платежа: клиент, API, PostgreSQL, relay, RabbitMQ, consumer, шлюз, webhook">
<defs>
